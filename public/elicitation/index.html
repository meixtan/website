rom the framework of cognitive work analysis. <em>Cognition, Technology &amp; Work, 8<\/em>(1), 41–49. <a href=\"https://doi.org/10.1007/s10111-005-0018-4\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1007/s10111-005-0018-4<\/a>"],"traditions":["Knowledge Engineering / AI","Psychology / Cognitive Science"],"path":["Tasks","Demonstrating","Explanations"],"id":"expert-commentary","hasContent":true}],"path":["Tasks","Demonstrating"],"id":"explanations","hasContent":false}],"path":["Tasks"]},{"name":"Judging","level":3,"desc":"Participants classify, sort, compare, rate, or make choices.","fields":[],"paras":[],"refs":[],"children":[{"name":"Rating","level":4,"desc":"","fields":[{"label":"Summary","paras":["Participants score examples on specified dimensions."]},{"label":"Method","paras":["The researcher presents examples, cases, or concepts and asks the expert to rate each on one or more dimensions, such as importance, difficulty, similarity, or likelihood. Researchers compare ratings across experts or examine which cases receive similar scores. Common response formats include the following.","<strong>Likert scale.<\/strong> Participants indicate agreement or disagreement using ordered response categories. Likert (1932) asked respondents to evaluate statements such as “The United States should have the largest military and naval air fleets in the world,” choosing Strongly Approve, Approve, Undecided, Disapprove, or Strongly Disapprove.","<strong>Semantic differential.<\/strong> Participants rate a word or concept along scales defined by opposing adjectives. Osgood (1952) studied the perceived meanings of words including <em>polite<\/em>, <em>eager<\/em>, and <em>burning<\/em> using scales such as strong–weak, active–passive, and hot–cold.","<strong>Magnitude estimation.<\/strong> Participants assign numerical values to perceived intensity. Stevens (1956) studied numerical estimates of how loud listeners perceived tones at different physical intensities.","<strong>Rubric-based rating.<\/strong> Participants assign scores using descriptions of performance at each level. Moskal (2000) presents a four-level holistic rubric for evaluating college students' written reports."]}],"paras":[],"refs":["Hoffman, R. R., Shadbolt, N. R., Burton, A. M., &amp; Klein, G. (1995). Eliciting knowledge from experts: A methodological analysis. <em>Organizational Behavior and Human Decision Processes, 62<\/em>(2), 129–158. <a href=\"https://doi.org/10.1006/obhd.1995.1039\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1006/obhd.1995.1039<\/a>","Likert, R. (1932). A technique for the measurement of attitudes. <em>Archives of Psychology, 140<\/em>, 1–55.","Osgood, C. E. (1952). The nature and measurement of meaning. <em>Psychological Bulletin, 49<\/em>(3), 197–237. <a href=\"https://doi.org/10.1037/h0055737\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1037/h0055737<\/a>","Stevens, S. S. (1956). The direct estimation of sensory magnitudes: Loudness. <em>The American Journal of Psychology, 69<\/em>(1), 1–25. <a href=\"https://doi.org/10.2307/1418112\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.2307/1418112<\/a>","Moskal, B. M. (2000). Scoring rubrics: What, when and how? <em>Practical Assessment, Research, and Evaluation, 7<\/em>(1), Article 3. <a href=\"https://doi.org/10.7275/a5vq-7q66\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.7275/a5vq-7q66<\/a>"],"traditions":["Psychology / Cognitive Science"],"subtypes":["Likert scale","Semantic differential","Magnitude estimation","Rubric-based rating"],"path":["Tasks","Judging"],"id":"rating","hasContent":true,"image":"images/methods/rating.jpg"},{"name":"Sorting","level":4,"desc":"","fields":[{"label":"Summary","paras":["Participants group examples according to shared characteristics."]},{"label":"Origins","paras":["Rooted in psychology and George Kelly's Personal Construct Theory, which studies the categories people construct. Knowledge engineers used sorting in the 1980s and 1990s to elicit expert classifications for rule-based AI systems. It later became common in website navigation and information architecture research."]},{"label":"Method","paras":["Researchers give participants cards, pictures, or objects and ask them to group them using one characteristic at a time. Researchers ask which criterion participants used, repeat with different criteria, and compare where participants agree or disagree.","<strong>Open sorting.<\/strong> Participants choose the groups and explain them.","<strong>Closed sorting.<\/strong> Researchers specify categories or rules."]},{"label":"Example","paras":["Reese and colleagues (2018) studied how clinicians organize patient information to improve electronic health records. Thirty-nine ICU clinicians openly sorted 29 patient data elements, including vital signs, lab results, medications, and notes. They grouped information into categories such as cardiovascular, respiratory, neurological, and infectious disease information. Researchers used the groups to propose a structure for ICU displays."]}],"paras":[],"refs":["Rugg, G., &amp; McGeorge, P. (1997). The sorting techniques: A tutorial paper on card sorts, picture sorts and item sorts. <em>Expert Systems, 14<\/em>(2), 80–93. <a href=\"https://doi.org/10.1111/1468-0394.00045\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1111/1468-0394.00045<\/a>","Rugg, G., Corbridge, C., Major, N. P., Burton, A. M., &amp; Shadbolt, N. R. (1992). A comparison of sorting techniques in knowledge acquisition. <em>Knowledge Acquisition, 4<\/em>(3), 279–291. <a href=\"https://doi.org/10.1016/1042-8143(92)90005-T\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1016/1042-8143(92)90005-T<\/a>","Reese, T., et al. (2018). Patient information organization in the intensive care setting: Expert knowledge elicitation with card sorting methods. <em>Journal of the American Medical Informatics Association, 25<\/em>(8), 1026–1035. <a href=\"https://doi.org/10.1093/jamia/ocy045\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1093/jamia/ocy045<\/a>"],"traditions":["Psychology / Cognitive Science","Knowledge Engineering / AI","Human-Computer Interaction / Design Research"],"subtypes":["Open sorting","Closed sorting"],"path":["Tasks","Judging"],"id":"sorting","hasContent":true,"image":"images/methods/sorting.jpg"},{"name":"Comparative judgment","level":4,"desc":"","fields":[{"label":"Summary","paras":["Participants compare pairs of examples on a specified dimension."]},{"label":"Origins","paras":["Comparative judgment originated in experimental psychology and psychophysics, the study of perceived differences between stimuli. Thurstone extended comparisons of physical properties, such as weight and shades of gray, to subjective qualities including handwriting and drawing quality."]},{"label":"Method","paras":["Researchers present two specimens at a time and ask which is better, greater, more likely, or more representative on a specified dimension. They collect judgments across multiple pairs and use the results to estimate a scale of perceived quality. Thurstone (1927) used handwriting samples as an example."]},{"label":"Example","paras":["Humphry and colleagues (2023) collected 324 student narrative writing samples. Teachers made 6,541 pairwise judgments about which piece demonstrated more advanced writing skills. A Bradley–Terry–Luce model converted the judgments into scale positions. Researchers selected eight samples at different quality levels for each year group to serve as assessment reference points."]}],"paras":[],"refs":["Thurstone, L. L. (1927). A law of comparative judgment. <em>Psychological Review, 34<\/em>(4), 273–286. <a href=\"https://doi.org/10.1037/h0070288\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1037/h0070288<\/a>","Humphry, S., Adie, L., Maxwell, C., &amp; Sappl, S. (2023). Using pairwise comparison and ordered exemplars as a basis for a novel method of standard setting in narrative writing. <em>Frontiers in Education, 8<\/em>, Article 1183695. <a href=\"https://doi.org/10.3389/feduc.2023.1183695\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.3389/feduc.2023.1183695<\/a>"],"traditions":["Psychology / Cognitive Science","Knowledge Engineering / AI"],"path":["Tasks","Judging"],"id":"comparative-judgment","hasContent":true,"image":"images/methods/comparative-judgment.jpg"},{"name":"Q-sort","level":4,"desc":"","fields":[{"label":"Summary","paras":["Participants arrange statements according to their level of agreement."]},{"label":"Origins","paras":["William Stephenson developed Q methodology in 1935. Trained in psychology and physics, he worked with Charles Spearman, a pioneer of factor analysis. While traditional factor analysis examines correlations between traits across people, Q methodology compares people's complete patterns of responses."]},{"label":"Method","paras":["Researchers prepare statements about a topic. Each participant sorts them according to a question, commonly from most agree to most disagree. Researchers compare complete sorts across participants to identify shared patterns of opinion and the statements that distinguish viewpoints."]},{"label":"Example","paras":["Bavin and colleagues (2020) studied attitudes toward reintroducing pine martens in Wales. They interviewed nine residents, collected 95 statements, and reduced them to 30. Twenty-nine other participants sorted the statements from −5 to +5. The researchers identified four viewpoints: Environmental Protectionist, Natural Resource Steward, Cautious Pragmatist, and Concerned Manager. Three broadly supported reintroduction for different reasons; the fourth opposed it, particularly over farming and predators."]}],"paras":[],"refs":["Brown, S. R. (1993). A primer on Q methodology. <em>Operant Subjectivity, 16<\/em>(3/4), 91–138. <a href=\"https://doi.org/10.15133/j.os.1993.002\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.15133/j.os.1993.002<\/a>","Bavin, D., MacPherson, J., Denman, H., Crowley, S. L., &amp; McDonald, R. A. (2020). Using Q-methodology to understand stakeholder perspectives on a carnivore translocation. <em>People and Nature, 2<\/em>(4), 1117–1130. <a href=\"https://doi.org/10.1002/pan3.10139\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1002/pan3.10139<\/a>"],"traditions":["Psychology / Cognitive Science"],"path":["Tasks","Judging"],"id":"q-sort","hasContent":true,"image":"images/methods/q-sort.jpg"},{"name":"Delphi","level":4,"desc":"","fields":[{"label":"Summary","paras":["Experts independently provide judgments, review aggregated responses, and reconsider their answers across rounds."]},{"label":"Origins","paras":["Developed at the RAND Corporation in the early 1950s. It grew out of operations research and forecasting, where researchers needed predictions based on expert judgment when data were limited."]},{"label":"Method","paras":["Researchers assemble a panel of experts and ask them to independently suggest ideas, judgments, or concerns, often through an open-ended questionnaire. They combine responses into items for experts to rate or rank, then summarize the results and disagreements. Experts reconsider their answers in another round. The process can repeat to examine agreement, disagreement, and changes after feedback."]},{"label":"Example","paras":["Dalkey and Helmer (1963) asked seven experts, including economists, a systems analyst, and an electronics engineer, to estimate how many atomic bombs would reduce Soviet munitions production by a specified amount in a hypothetical war. Initial estimates differed sharply, from 50 to 5,000. Researchers asked about assumptions and information needed, supplied data on industrial production and World War II bombing damage, and invited revised estimates. Estimates converged, though the study could not establish which were correct."]}],"paras":[],"refs":["Hsu, C., &amp; Sandford, B. A. (2007). The Delphi technique: Making sense of consensus. <em>Practical Assessment, Research, and Evaluation, 12<\/em>(1), Article 10. <a href=\"https://doi.org/10.7275/pdz9-th90\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.7275/pdz9-th90<\/a>","Dalkey, N., &amp; Helmer, O. (1963). An experimental application of the Delphi method to the use of experts. <em>Management Science, 9<\/em>(3), 458–467. <a href=\"https://doi.org/10.1287/mnsc.9.3.458\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1287/mnsc.9.3.458<\/a>"],"traditions":["Decision Science / Operations Research"],"path":["Tasks","Judging"],"id":"delphi","hasContent":true,"image":"images/methods/delphi.jpg"}],"path":["Tasks"]},{"name":"Creating","level":3,"desc":"Participants create materials or designs.","fields":[],"paras":[],"refs":[],"children":[{"name":"Cultural probes","level":4,"desc":"","fields":[{"label":"Summary","paras":["Participants complete creative activities in their everyday lives using materials provided by researchers."]},{"label":"Origins","paras":["Rooted in artistic practices associated with the Situationists, Surrealists, and Dadaists, later adapted for interaction design. Gaver and colleagues described probes as a source of “inspiration, not information.”"]},{"label":"Method","paras":["Researchers prepare a package of activities that participants complete in their everyday lives and return. Materials can include postcards with questions, maps to mark, cameras with photography assignments, and diaries. Researchers examine what participants produce to inspire further investigation and design."]},{"label":"Example","paras":["In the Presence Project, Gaver and colleagues (1999) explored how technology could help older adults in Norway, the Netherlands, and Italy participate in their communities. Participants received stamped postcards with questions, maps and stickers for marking places where they met people or wanted to visit, disposable cameras with assignments, and diaries. Some maps also asked participants to mark places to be alone, daydream, or identify local landmarks and places where people injected drugs."]}],"paras":[],"refs":["Gaver, B., Dunne, T., &amp; Pacenti, E. (1999). Cultural probes. <em>interactions, 6<\/em>(1), 21–29. <a href=\"https://doi.org/10.1145/291224.291235\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1145/291224.291235<\/a>"],"traditions":["Human-Computer Interaction / Design Research"],"path":["Tasks","Creating"],"id":"cultural-probes","hasContent":true,"image":"images/methods/cultural-probes.jpg"},{"name":"Participatory drawing","level":4,"desc":"","fields":[],"paras":[],"refs":[],"children":[{"name":"Artwork","level":5,"desc":"","fields":[{"label":"Summary","paras":["Participants draw their experiences or understanding of a topic."]},{"label":"Origins","paras":["Draws on anthropology's use of visual materials to understand people's lives, psychology's use of children's drawings, and sociology's use of images to document social life."]},{"label":"Method","paras":["The researcher asks a participant to draw something relevant to the research question, such as how they experience an illness, see themselves, or understand a situation. The participant chooses what to depict and how. The researcher then asks them to explain the drawing and its elements."]},{"label":"Examples","paras":["Guillemin (2004) interviewed participants attending menopause clinics and patients with heart disease about their experiences. She then gave them blank cards and colored felt pens and asked them to draw how they visualized their condition. Participants explained their drawings afterward.","Literat (2013) described drawing activities in The Modern Story, a digital storytelling program in Indian public schools. Asked what her community looked like, a 13-year-old drew wealthy landowners in a large house at the top, her family in a modest house with animals, and Dalit families as small figures without a house. In another exercise, students drew self-portraits before and after the course; one after drawing showed a student outdoors with her smiling parents."],"images":[{"src":"images/studies/literat.jpg","caption":"Literat (2013)","para":1}]}],"paras":[],"refs":["Guillemin, M. (2004). Understanding illness: Using drawings as a research method. <em>Qualitative Health Research, 14<\/em>(2), 272–289. <a href=\"https://doi.org/10.1177/1049732303260445\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1177/1049732303260445<\/a>","Literat, I. (2013). “A pencil for your thoughts”: Participatory drawing as a visual research method with children and youth. <em>International Journal of Qualitative Methods, 12<\/em>(1), 84–98. <a href=\"https://doi.org/10.1177/160940691301200143\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1177/160940691301200143<\/a>"],"traditions":["Sociology / Qualitative Research"],"path":["Tasks","Creating","Participatory drawing"],"id":"artwork","hasContent":true,"image":"images/methods/artwork.jpg"},{"name":"Maps (participatory mapping)","level":5,"desc":"","fields":[{"label":"Summary","paras":["Participants draw or annotate maps of familiar places."]},{"label":"Method","paras":["Researchers ask community members to draw maps of a familiar area or annotate existing maps, marking locations, resources, boundaries, routes, or problems. Researchers ask participants to explain their markings and record the discussions."]}],"paras":[],"refs":["Chambers, R. (2006). Participatory mapping and geographic information systems: Whose map? Who is empowered and who disempowered? Who gains and who loses? <em>The Electronic Journal of Information Systems in Developing Countries, 25<\/em>(1), 1–11. <a href=\"https://doi.org/10.1002/j.1681-4835.2006.tb00163.x\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1002/j.1681-4835.2006.tb00163.x<\/a>"],"traditions":["Anthropology / Ethnography","Sociology / Qualitative Research"],"path":["Tasks","Creating","Participatory drawing"],"id":"maps-participatory-mapping","hasContent":true,"image":"images/methods/maps-participatory-mapping.jpg"}],"path":["Tasks","Creating"],"id":"participatory-drawing","hasContent":false},{"name":"Participatory design","level":4,"desc":"","fields":[{"label":"Summary","paras":["Participants collaborate with designers to develop or improve systems."]},{"label":"Origins","paras":["Developed in Scandinavia during the 1970s and 1980s through workplace democracy and cooperative systems design. Researchers involved workers in designing the tools they would use to understand their work practices, needs, priorities, and ideas for future work."]},{"label":"Method","paras":["People who will use a proposed system or service work with researchers and designers to develop it. Depending on the project, they identify problems with current tools, sketch alternatives, build mockups, act out situations, or evaluate prototypes. Researchers use their designs and responses to revise the system."]}],"paras":[],"refs":["Spinuzzi, C. (2005). The methodology of participatory design. <em>Technical Communication, 52<\/em>(2), 163–174.","Schuler, D., &amp; Namioka, A. (Eds.). (1993). <em>Participatory design: Principles and practices<\/em>. Lawrence Erlbaum Associates."],"children":[{"name":"Participatory design workshops","level":5,"desc":"","fields":[{"label":"Summary","paras":["Participants collectively identify problems and develop design proposals."]},{"label":"Broader approach","paras":["Participatory design"]},{"label":"Method","paras":["Participants work together to identify problems, generate ideas, develop designs, and refine proposals, often across several sessions."]},{"label":"Example","paras":["Reddy and colleagues (2019) wanted to improve medication safety for older adults using over-the-counter medicines. They organized six participatory design sessions with pharmacy staff and patients. Participants identified barriers, proposed solutions, narrowed and combined ideas, developed an intervention, reacted to a prototype, and refined it."]}],"paras":[],"refs":["Reddy, A., Lester, C. A., Stone, J. A., Holden, R. J., Phelan, C. H., &amp; Chui, M. A. (2019). Applying participatory design to a pharmacy system intervention. <em>Research in Social and Administrative Pharmacy, 15<\/em>(11), 1358–1367. <a href=\"https://doi.org/10.1016/j.sapharm.2018.11.012\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1016/j.sapharm.2018.11.012<\/a>"],"traditions":["Human-Computer Interaction / Design Research"],"path":["Tasks","Creating","Participatory design"],"id":"participatory-design-workshops","hasContent":true,"image":"images/methods/participatory-design-workshops.jpg"},{"name":"Future workshops","level":5,"desc":"","fields":[{"label":"Summary","paras":["Participants critique current problems, imagine ideal futures, and plan feasible actions."]},{"label":"Broader approach","paras":["Participatory design"]},{"label":"Origins","paras":["Developed to allow ordinary citizens to envision and shape social change. Future workshops were later used in cooperative systems design."]},{"label":"Method","paras":["A future workshop has three phases. In <strong>critique<\/strong>, participants identify problems, write criticisms on paper or sticky notes, group them by theme, and select issues to address. In <strong>fantasy<\/strong>, they imagine possibilities without worrying about feasibility, using brainstorming, stories, drawings, or role-playing. In <strong>implementation<\/strong>, they review the visions, assess feasibility, choose ideas, and develop actions or proposals."]},{"label":"Example","paras":["Ursin and colleagues (2021) held a two-day climate workshop in Norway with 38 young people aged 10–18 to gather ideas for a county climate strategy."]}],"paras":[],"refs":["Kensing, F., &amp; Madsen, K. H. (1991). Generating visions: Future workshops and metaphors. In J. Greenbaum &amp; M. Kyng (Eds.), <em>Design at work: Cooperative design of computer systems<\/em> (pp. 155–168). Lawrence Erlbaum Associates.","Jungk, R., &amp; Müllert, N. R. (1987). <em>Future workshops: How to create desirable futures<\/em>. Institute for Social Inventions.","Ursin, M., Lorgen, L. C., Ortega Alvarado, I. A., Smalsundmo, A.-L., Nordgård, R. C., Bern, M. R., &amp; Bjørnevik, K. (2021). Promoting intergenerational justice through participatory practices: Climate workshops as an arena for young people’s political participation. <em>Frontiers in Psychology, 12<\/em>, Article 727227. <a href=\"https://doi.org/10.3389/fpsyg.2021.727227\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.3389/fpsyg.2021.727227<\/a>"],"traditions":["Human-Computer Interaction / Design Research"],"path":["Tasks","Creating","Participatory design"],"id":"future-workshops","hasContent":true,"image":"images/methods/future-workshops.jpg"},{"name":"Generative toolkits","level":5,"desc":"","fields":[{"label":"Summary","paras":["Participants arrange provided visual materials into collages or models to express their ideas."]},{"label":"Broader approach","paras":["Participatory design"]},{"label":"Origins","paras":["Developed within participatory design. In an early 1980s project to design a voice-controlled headset for preschool children, Sanders used activities such as coloring pictures of headsets, selecting among nine painted headsets, and constructing objects. This led toward toolkits that let people express ideas visually without training as designers."]},{"label":"Method","paras":["Researchers prepare a set of materials, such as photographs, stickers, colored shapes, words, and sketches, that participants can select, combine, rearrange, and extend. Participants respond to a prompt about an experience, their understanding of a situation, or something they want in the future. They arrange the materials into a collage, map, story, or model and explain what they made. Researchers use the artifacts to understand participants' ideas or begin designing with them."]},{"label":"Examples","paras":["Sanders (2000) describes activities for representing health experiences and mapping an ideal pet store.","Sanders and Stappers (2008) describe nurses arranging shapes to show an ideal workflow on a patient floor, then using 3D models to develop a new pod design for the hospital layout."],"images":[{"src":"images/studies/sanders-2000.jpg","caption":"Sanders (2000)","para":0},{"src":"images/studies/sanders-2008.jpg","caption":"Sanders and Stappers (2008)","para":1}]}],"paras":[],"refs":["Sanders, E. B.-N. (2000). Generative tools for co-designing. In S. A. R. Scrivener, L. J. Ball, &amp; A. Woodcock (Eds.), <em>Collaborative design<\/em> (pp. 3–12). Springer. <a href=\"https://doi.org/10.1007/978-1-4471-0779-8_1\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1007/978-1-4471-0779-8_1<\/a>","Sanders, E. B.-N., &amp; Stappers, P. J. (2008). Co-creation and the new landscapes of design. <em>CoDesign, 4<\/em>(1), 5–18. <a href=\"https://doi.org/10.1080/15710880701875068\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.1080/15710880701875068<\/a>"],"traditions":["Human-Computer Interaction / Design Research"],"path":["Tasks","Creating","Participatory design"],"id":"generative-toolkits","hasContent":true,"image":"images/methods/generative-toolkits.jpg"},{"name":"PICTIVE","level":5,"desc":"","fields":[{"label":"Summary","paras":["Participants collaboratively construct interface mockups using paper and movable elements."]},{"label":"Broader approach","paras":["Participatory design"]},{"label":"Method","paras":["The researcher brings users and designers together around a shared workspace. They use paper, sticky notes, labels, markers, and prepared interface elements to construct a proposed screen or system. Participants move, replace, and annotate elements while discussing how the interface should work. Sessions are recorded on video so the team can revisit design decisions and explanations."]},{"label":"Example","paras":["Osman and Hwang (2021) asked 20 adults aged 52–75 with /* ---------- traditions ---------- */
const SHORT = {
  "Knowledge Engineering / AI": "Knowledge engineering",
  "Psychology / Cognitive Science": "Psychology",
  "Anthropology / Ethnography": "Anthropology",
  "Sociology / Qualitative Research": "Sociology",
  "Human-Computer Interaction / Design Research": "HCI & design",
  "Decision Science / Operations Research": "Decision science",
};
const ORDER = Object.keys(SHORT);
const TRADS = ORDER.filter(t => DATA.traditions.includes(t)).concat(DATA.traditions.filter(t => !ORDER.includes(t)));
const tColor = t => `var(--t${Math.max(0, ORDER.indexOf(t)) % 6})`;
const tShort = t => SHORT[t] || t;

/* ---------- flatten ---------- */
const strip = s => s.replace(/<[^>]+>/g, "");
const methods = [];          // every node with an id, in document order
const byId = new Map();
function index(node, cat, parent) {
  if (node.id) {
    node._cat = cat; node._parent = parent;
    node._text = (node.name + " " + node.fields.map(f => f.label + " " + f.paras.join(" ")).join(" ") + " " +
      (node.traditions || []).join(" ")).toLowerCase();
    node._text = strip(node._text);
    node._tags = node.fields.filter(f => /^Tags?$/.test(f.label))
      .flatMap(f => strip(f.paras.join(" ")).split(";").map(t => t.trim()).filter(Boolean));
    methods.push(node); byId.set(node.id, node);
  }
  (node.children || []).forEach(c => index(c, cat, node));
}
DATA.categories.forEach(c => index(c, c, null));
const readable = methods.filter(m => m.hasContent);
const countIn = n => (n.id && n.hasContent ? 1 : 0) + (n.children || []).reduce((a, c) => a + countIn(c), 0);

/* ---------- state ---------- */
const state = { cat: DATA.categories[0].name, trad: null, tag: null, q: "" };
function matches(m) {
  if (!m.hasContent) return false;
  if (state.trad && !(m.traditions || []).includes(state.trad)) return false;
  if (state.tag && !m._tags.includes(state.tag)) return false;
  if (state.q && !m._text.includes(state.q)) return false;
  return true;
}
const filtering = () => !!(state.trad || state.tag || state.q);

/* ---------- pie dot as CSS (for index + chips) ---------- */
function pieCSS(trads) {
  if (!trads || !trads.length) return "background: transparent; border: 1.5px solid var(--muted)";
  if (trads.length === 1) return `background: ${tColor(trads[0])}`;
  const step = 360 / trads.length;
  return `background: conic-gradient(${trads.map((t, i) => `${tColor(t)} ${i * step}deg ${(i + 1) * step}deg`).join(",")})`;
}

/* ---------- header bits ---------- */

const catsEl = document.getElementById("cats");
const catOptions = DATA.categories.map(c => ({ name: c.name, desc: c.desc }));
catOptions.forEach(o => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "cat-btn"; b.dataset.cat = o.name;
  b.innerHTML = `<span class="t">${o.name}</span><span class="d">${o.desc}</span>`;
  b.addEventListener("click", () => { state.cat = o.name; syncCats(); renderTree(true); });
  catsEl.appendChild(b);
});
function syncCats() {
  catsEl.querySelectorAll(".cat-btn").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === state.cat));
}

const legend = document.getElementById("legend");
TRADS.forEach(t => {
  const n = readable.filter(m => (m.traditions || []).includes(t)).length;
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.dataset.trad = t; b.title = t;
  b.setAttribute("aria-pressed", "false");
  b.innerHTML = `<span class="dot" style="background:${tColor(t)}"></span>${tShort(t)}`;
  b.addEventListener("click", () => { state.trad = state.trad === t ? null : t; applyFilter(); });

/* ---------- tree ---------- */
const tagsEl = document.getElementById("tags");
[...new Set(readable.flatMap(m => m._tags))].forEach(t => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "tag tag-btn"; b.dataset.tag = t; b.textContent = t;
  b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", () => { state.tag = state.tag === t ? null : t; applyFilter(); });
  tagsEl.appendChild(b);
});

const svg = d3.select("#tree");
const measureCtx = document.createElement("canvas").getContext("2d");
function textW(s, kind) {
  measureCtx.font = kind === "method" ? "14px Geist, system-ui, sans-serif" : "600 14px Geist, system-ui, sans-serif";
  return measureCtx.measureText(s).width;
}
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let nodeSel, linkSel;

function renderTree(animate) {
  const both = state.cat === "Both";
  const rootData = both ? { name: "Knowledge elicitation", level: 1, children: DATA.categories } :
    DATA.categories.find(c => c.name === state.cat);
  const root = d3.hierarchy(rootData, d => d.children);
  const ROW = 30;
  d3.tree().nodeSize([ROW, 1]).separation((a, b) => (a.parent === b.parent ? 1 : 1.35))(root);
  const narrow = window.innerWidth < 640;
  const COLX = both ? [0, 130, 280, 470, 700] : (narrow ? [0, 140, 320, 550] : [0, 160, 350, 580]);
  root.each(d => { d.y = COLX[d.depth]; });

  const kind = d => d.data.id ? "method" : "struct";
  const labelLeft = d => !!d.children;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  root.each(d => {
    const w = textW(d.data.name, kind(d));
    minX = Math.min(minX, d.x); maxX = Math.max(maxX, d.x);
    minY = Math.min(minY, labelLeft(d) ? d.y - 14 - w : d.y);
    maxY = Math.max(maxY, labelLeft(d) ? d.y : d.y + 14 + w);
  });
  const pad = 14;
  const W = Math.ceil(maxY - minY + pad * 2), H = Math.ceil(maxX - minX + pad * 2 + 10);
  svg.attr("width", W).attr("height", H).attr("viewBox", [minY - pad, minX - pad - 5, W, H].join(" "));
  svg.selectAll("*").remove();

  const dur = animate && !reduceMotion ? 550 : 0;
  const ease = d3.easeCubicOut;
  const linkPath = d3.linkHorizontal().x(p => p.y).y(p => p.x);
  const gLinks = svg.append("g"), gNodes = svg.append("g");

  linkSel = gLinks.selectAll("path").data(root.links()).join("path")
    .attr("class", "link")
    .attr("d", l => linkPath({ source: l.source, target: l.source }))
    .call(s => dur ? s.transition().duration(dur).ease(ease).delay(l => l.source.depth * 60).attr("d", linkPath) : s.attr("d", linkPath));

  nodeSel = gNodes.selectAll("g").data(root.descendants()).join("g")
    .attr("class", d => {
      const c = ["node"];
      if (d.depth === 0) c.push("root");
      if (d.data.id && d.children) c.push("group");
      if (d.data.id) c.push(d.data.hasContent ? "method clickable" : "");
      return c.join(" ");
    })
    .attr("transform", d => `translate(${(d.parent || d).y},${(d.parent || d).x})`)
    .style("opacity", dur ? 0 : null);
  if (!dur) nodeSel.attr("transform", d => `translate(${d.y},${d.x})`);
  else nodeSel.transition().duration(dur).ease(ease).delay(d => Math.max(0, d.depth - 1) * 60)
    .attr("transform", d => `translate(${d.y},${d.x})`).style("opacity", 1)
    .on("end", function () { d3.select(this).style("opacity", null); });

  // marks
  const pie = d3.pie().value(1).sort(null), arc = d3.arc().innerRadius(0).outerRadius(6.5);
  nodeSel.each(function (d) {
    const g = d3.select(this);
    if (d.data.id && d.data.hasContent && d.data.traditions && d.data.traditions.length) {
      const t = d.data.traditions;
      if (t.length === 1) g.append("circle").attr("r", 6.5).style("fill", tColor(t[0]));
      else g.selectAll("path.w").data(pie(t)).join("path").attr("d", arc).style("fill", a => tColor(a.data));
      g.append("circle").attr("class", "ring").attr("r", 7.25);
    } else if (d.depth === 0) {
      g.append("circle").attr("class", "solid").attr("r", 6);
    } else {
      g.append("circle").attr("class", "hollow").attr("r", 4.5);
    }
    const left = labelLeft(d);
    const label = g.append("text")
      .attr("class", kind(d) === "method" ? "lab-method" : "lab-struct")
      .attr("x", left ? -13 : 13).attr("dy", "0.34em")
      .attr("text-anchor", left ? "end" : "start")
      .text(d.data.name);
    if (d.data.id && d.data.hasContent) {
      const w = textW(d.data.name, "method");
      g.insert("rect", ":first-child").attr("class", "hit")
        .attr("x", left ? -18 - w : -10).attr("y", -12).attr("width", w + 30).attr("height", 24).attr("rx", 4);
      g.attr("tabindex", 0).attr("role", "button").attr("aria-label", `${d.data.name}: open details`)
        .on("click", () => openMethod(d.data.id))
        .on("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openMethod(d.data.id); } });
    }
    g.on("mouseenter focus", () => highlight(d, true)).on("mouseleave blur", () => highlight(d, false));
  });
  applyFilter();
}

function highlight(d, on) {
  const anc = new Set(d.ancestors());
  linkSel.classed("hl", l => on && anc.has(l.target));
}

function applyFilter() {
  const active = filtering();
  legend.classList.toggle("filtering", !!state.trad);
  legend.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.trad === state.trad));
  tagsEl.querySelectorAll(".tag-btn").forEach(b => b.setAttribute("aria-pressed", b.dataset.tag === state.tag));
  const live = d => {
    if (!active) return true;
    if (d.data.id && matches(d.data)) return true;
    return (d.children || []).some(live);
  };
  if (nodeSel) {
    nodeSel.classed("dim", d => active && !live(d));
    linkSel.classed("dim", l => active && !live(l.target));
  }
  document.querySelectorAll("#index li[data-id]").forEach(li => {
    const m = byId.get(li.dataset.id);
    const hit = !active || matches(m) || (m.children || []).some(matches);
    li.classList.toggle("dim", !hit);
  });
}

/* ---------- index ---------- */
function methodItem(m) {
  const li = document.createElement("li");
  li.dataset.id = m.id;
  const b = document.createElement("button");
  b.type = "button"; b.className = "mbtn" + (m.hasContent ? "" : " nocontent") + (m.children ? " parent" : "");
  b.innerHTML = `<span class="pie" style="${pieCSS(m.hasContent ? m.traditions : null)}"></span><span>${m.name}</span>`;
  if (m.hasContent) b.addEventListener("click", () => openMethod(m.id)); else b.tabIndex = -1;
  li.appendChild(b);
  if (m.children) {
    const ul = document.createElement("ul");
    m.children.forEach(c => ul.appendChild(methodItem(c)));
    li.appendChild(ul);
  }
  if (m.subtypes) {
    const ul = document.createElement("ul");
    ul.className = "subtypes";
    m.subtypes.forEach(name => {
      const sli = document.createElement("li");
      const sb = document.createElement("button");
      sb.type = "button"; sb.className = "mbtn subtype"; sb.textContent = name;
      sb.setAttribute("aria-label", `${name} (part of ${m.name})`);
      sb.addEventListener("click", () => openMethod(m.id));
      sli.appendChild(sb); ul.appendChild(sli);
    });
    li.appendChild(ul);
  }
  return li;
}
const idxEl = document.getElementById("index");
DATA.categories.forEach(cat => {
  const wrap = document.createElement("div"); wrap.className = "index-cat";
  wrap.innerHTML = `<h3>${cat.name}</h3><p>${cat.desc}</p>`;
  const grid = document.createElement("div"); grid.className = "index-grid";
  (cat.children || []).forEach(br => {
    const blk = document.createElement("div"); blk.className = "branch-block";
    blk.innerHTML = `<h4>${br.name}</h4>${br.desc ? `<p>${br.desc}</p>` : ""}`;
    const ul = document.createElement("ul");
    (br.children || []).forEach(m => ul.appendChild(methodItem(m)));
    blk.appendChild(ul); grid.appendChild(blk);
  });
  wrap.appendChild(grid); idxEl.appendChild(wrap);
});

/* ---------- prose ---------- */
document.getElementById("page-title").textContent = DATA.title;
document.getElementById("intro-text").innerHTML = DATA.intro.map(p => `<p>${p}</p>`).join("");
document.getElementById("prose-after").innerHTML = DATA.sections.map(sec =>
  `<section class="prose" id="${sec.id}"><h2>${sec.name}</h2>${sec.paras.map(p => `<p>${p}</p>`).join("")}</section>`).join("");
const ovRefs = DATA.refs || [];
document.getElementById("ov-refs").innerHTML = ovRefs.map(r => `<li>${r}</li>`).join("");
document.getElementById("ov-refs-h").hidden = !ovRefs.length;

/* ---------- drawer ---------- */
const drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim");
const META = ["Summary", "Also called", "Tag", "Tags", "Broader approach"];
const ORDER_FIELDS = l => /^Method/.test(l) ? 0 : /^Examples?$/.test(l) ? 1 : /^Origins/.test(l) ? 2 : 3;
let lastFocus = null, currentId = null;

// illustrations float beside the example paragraph they depict; a method without study images uses its own image
function figImg(src, alt, cls = "d-fig") {
  return `<img class="${cls}" src="${src}" alt="${alt.replace(/"/g, "&quot;")}" loading="lazy">`;
}
function exampleParas(f, m) {
  const imgs = f.images || [];
  return f.paras.map((p, pi) => {
    let figs = imgs.filter(x => x.para === pi).map(x => figImg(x.src, `Illustration of ${x.caption}`)).join("");
    // a full method illustration fills the first paragraph when no study image claims it
    if (pi === 0 && !figs && m.image && (!imgs.length || m.image.startsWith("images/methods/"))) figs = figImg(m.image, `Illustration of ${m.name.toLowerCase()}`);
    return figs ? `<div class="d-expara">${figs}<p>${p}</p></div>` : `<p>${p}</p>`;
  }).join("");
}

function openMethod(id, fromHash) {
  const m = byId.get(id);
  if (!m || !m.hasContent) return;
  if (!drawer.classList.contains("open")) lastFocus = document.activeElement;
  currentId = id;
  // sync tree to this method's category
  if (state.cat !== "Both" && state.cat !== m._cat.name) { state.cat = m._cat.name; syncCats(); renderTree(false); }

  const crumb = [...m.path.slice(), ];
  document.getElementById("d-crumb").textContent = crumb.join(" / ");
  document.getElementById("d-title").textContent = m.name;
  document.getElementById("d-trads").innerHTML = (m.traditions || []).map(t =>
    `<span class="chip" title="${t}"><span class="dot" style="background:${tColor(t)}"></span>${t}</span>`).join("");

  const meta = m.fields.filter(f => META.includes(f.label));
  const tags = meta.filter(f => /^Tags?$/.test(f.label))
    .flatMap(f => strip(f.paras.join(" ")).split(";").map(t => t.trim()).filter(Boolean));
  document.getElementById("d-trads").insertAdjacentHTML("beforeend", tags.map(t => `<span class="tag">${t}</span>`).join(""));
  // the broader approach (e.g. Participatory design) shows as a pill that links to its page
  const broaderField = meta.find(f => f.label === "Broader approach");
  const broaderName = broaderField ? strip(broaderField.paras.join(" ")).trim()
    : (m._parent && m._parent.hasContent ? m._parent.name : "");
  const broader = broaderName && methods.find(x => x.name === broaderName && x.hasContent && x.id !== m.id);
  if (broaderName) document.getElementById("d-trads").insertAdjacentHTML("beforeend",
    broader ? `<a class="tag tag-link" href="#${broader.id}">${broader.name}</a>` : `<span class="tag">${broaderName}</span>`);
  const metaHTML = meta.filter(f => !/^(Tags?|Summary|Broader approach)$/.test(f.label))
    .map(f => `<dt>${f.label}</dt><dd>${f.paras.join(" ")}</dd>`).join("");
  const metaEl = document.getElementById("d-meta");
  metaEl.innerHTML = metaHTML; metaEl.hidden = !metaHTML;

  const summary = m.fields.find(f => f.label === "Summary");
  const sumEl = document.getElementById("d-summary");
  sumEl.innerHTML = summary ? summary.paras.join(" ") : "";
  // soft gradient across the method's tradition colors (a flat tint when there is only one)
  const tcs = (m.traditions || []).map(tColor);
  const tint = c => `color-mix(in srgb, ${c} 13%, var(--surface))`;
  sumEl.style.background = !tcs.length ? "" : tcs.length === 1 ? tint(tcs[0])
    : `linear-gradient(100deg, ${tcs.map(tint).join(", ")})`;
  sumEl.style.borderColor = tcs.length ? `color-mix(in srgb, var(--fg) 9%, transparent)` : "";

  const hasEx = m.fields.some(f => /^Examples?$/.test(f.label));
  let body = m.fields.filter(f => !META.includes(f.label))
    .map((f, i) => ({ f, i })).sort((a, b) => ORDER_FIELDS(a.f.label) - ORDER_FIELDS(b.f.label) || a.i - b.i)
    .map(({ f }) => {
      const isEx = /^Examples?$/.test(f.label);
      // no example section: the method's illustration floats beside the Method text instead
      const withFig = isEx || (!hasEx && /^Method/.test(f.label) && m.image);
      return `<div class="d-sec${withFig ? " d-example" : ""}"><h3>${f.label}</h3>${withFig ? exampleParas(f, m) : f.paras.map(p => `<p>${p}</p>`).join("")}</div>`;
    }).join("");
  if (m.children && m.children.length) {
    body += `<div class="d-sec"><h3>Variants</h3><ul class="d-variants">${m.children.map(c =>
      `<li><a class="mbtn" href="#${c.id}"><span class="pie" style="${pieCSS(c.traditions)}"></span><span>${c.name}</span></a></li>`).join("")}</ul></div>`;
  }
  if (m.refs.length) {
    body += `<details class="d-sec d-refs"><summary>${m.refs.length === 1 ? "Reference" : "References"} <span>${m.refs.length}</span></summary><ul class="refs">${m.refs.map(r => `<li>${r}</li>`).join("")}</ul></details>`;
  }
  document.getElementById("d-body").innerHTML = body;


  drawer.classList.add("open"); scrim.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  drawer.scrollTop = 0;
  document.body.style.overflow = "hidden";
  if (!fromHash && location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  requestAnimationFrame(() => document.getElementById("d-title").focus({ preventScroll: true }));
}
function closeDrawer() {
  if (!drawer.classList.contains("open")) return;
  drawer.classList.remove("open"); scrim.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  currentId = null;
  if (byId.has(location.hash.slice(1))) history.replaceState(null, "", "#explore");
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
document.getElementById("d-close").addEventListener("click", closeDrawer);
scrim.addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

function routeHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (byId.has(id)) openMethod(id, true); else if (currentId) closeDrawer();
}
window.addEventListener("hashchange", routeHash);

/* ---------- boot ---------- */
let lastW = window.innerWidth;
window.addEventListener("resize", () => {
  if ((lastW < 640) !== (window.innerWidth < 640)) renderTree(false);
  lastW = window.innerWidth;
});
syncCats();
renderTree(false);
const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
fontsReady.then(() => renderTree(false));
routeHash();
</script>
